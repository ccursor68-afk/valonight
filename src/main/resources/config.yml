# ============================================================
#  Gece Pazari - Yapilandirma Dosyasi
# ============================================================
# Etkinlik suresince her oyuncunun pazari sabittir.
# Pazar acildiginda asagidaki havuzdan agirlikli sans ile 5 esya secilir.
# ------------------------------------------------------------

# Discord Webhook URL'sini buraya girin (bos birakirsaniz devre disi kalir).
discord-webhook-url: ""

# Pazar GUI ayarlari
gui:
  title: "&8&lGece Pazari"
  open-button:
    material: NETHER_STAR
    name: "&d&lPazari Ac"
    lore:
      - "&7Tikla, sana ozel pazari ortaya cikar."
      - ""
      - "&8Sadece bu gece..."

# Pazar mekanik ayarlari
market:
  # Oyuncunun etrafindaki yarim ay yaricapi (blok)
  radius: 3.0
  # Oyuncunun bakis yonunde yarim ay'in ortalama yuksekligi (goz hizasina gore offset)
  height-offset: 0.2
  # Yarim ayin acisi (derece olarak). 180 = tam yari cember.
  arc-degrees: 160.0
  # Esyalarin oyuncuya gore sabitlendigi mesafe icin yumusatma (tick cinsinden)
  teleport-duration: 3
  # Pozisyon guncelleme tick araligi
  update-interval-ticks: 2
  # Display dondurme hizi (derece / saniye). 0 olursa donmez.
  rotation-speed: 25.0

# Etkinlik mesajlari
messages:
  prefix: "&8[&dGece Pazari&8] &r"
  no-permission: "&cBunun icin yetkin yok."
  player-only: "&cBu komut sadece oyuncular icin."
  not-active: "&7Su an aktif bir Gece Pazari yok."
  market-opened: "&dPazar onunde belirdi. Etrafina bak!"
  market-closed: "&7Pazar sis icinde kayboldu."
  purchase-success: "&aSatin alindi: &f{item} &7- &6{price}$"
  insufficient-funds: "&cYeterli paran yok. Gerekli: &6{price}$"
  out-of-stock: "&cBu esya tukendi."
  event-started: "&d&lGece Pazari aciliyor! &7/gecepazari yazarak goz at."
  event-already-active: "&eGece Pazari zaten aktif."
  event-not-active: "&eGece Pazari zaten kapali."
  event-stopped: "&7Gece Pazari kapatildi."
  reload-success: "&aYapilandirma yeniden yuklendi."

# Discord embed yapilandirmasi
discord:
  username: "Gece Pazari"
  avatar-url: ""
  embed:
    title: "Gece Pazari Acildi!"
    description: "Hemen sunucuya gir ve sana ozel indirimleri yakala. Pazar yalnizca bu gece acik!"
    color: 13369599   # mor/pembe ton
    footer: "Gece Pazari - Sadece bu gece"
    thumbnail-url: ""

# ------------------------------------------------------------
#  Esya Havuzu
# ------------------------------------------------------------
# Her esya icin:
#   material         : Minecraft eşya turu (Bukkit Material enum)
#   display-name     : Hologramda ve envanterde gozukecek ad (renk kodu destekli)
#   lore             : Hologramda alt satirlarda gosterilecek aciklamalar
#   base-price       : Indirim oncesi temel fiyat
#   chance           : Havuzdan secilme agirligi (yuksek = daha sik). Toplam 100 olmasi sart degil.
#   max-stock        : Maksimum stok adedi (her oyuncu icin ayri)
#   discount:
#     min            : Minimum indirim yuzdesi
#     max            : Maksimum indirim yuzdesi
#   reward:
#     type           : "ITEM" veya "COMMAND"
#     amount         : ITEM ise verilecek adet
#     command        : COMMAND ise calistirilacak komut (%player% yer tutucusu desteklenir, console olarak calisir)
# ------------------------------------------------------------
items:
  diamond-sword:
    material: DIAMOND_SWORD
    display-name: "&bElmas Kilic"
    lore:
      - "&7Keskinlestirilmis bir elmas kilic."
