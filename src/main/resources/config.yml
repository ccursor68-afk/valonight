# ============================================================
#  ENightMarket - Configuration
#  Author: ArtfulMiner
# ============================================================
# Player messages and GUI text live in plugins/ENightMarket/lang/*.yml
# Players can switch language with /gecepazari lang <en|tr|de>
# ------------------------------------------------------------

# Default language for new players. Options: en | tr | de
default-language: en

# ------------------------------------------------------------
# Automatic schedule
# ------------------------------------------------------------
schedule:
  enabled: false

  # Opening day: MONDAY .. SUNDAY, or ANY for every day
  day: FRIDAY

  # Time in 24h format (HH:mm)
  time: "20:00"

  # Auto-close after N hours. 0 = manual stop only (/enightmarket stop)
  auto-close-after-hours: 24

# Discord webhook URL (leave empty to disable)
discord-webhook-url: ""

# Market display settings
market:
  radius: 4.5
  height-offset: 0.2
  arc-degrees: 150.0
  teleport-duration: 3
  update-interval-ticks: 2
  bob-amplitude: 0.15
  bob-speed: 2.5

# Discord embed (server-wide, not localized)
discord:
  username: "Night Market"
  avatar-url: ""
  embed:
    title: "Night Market Is Open!"
    description: "Join the server and grab your personal discounts. The market is open for a limited time!"
    color: 13369599
    footer: "ENightMarket - by ArtfulMiner"
    thumbnail-url: ""

# ------------------------------------------------------------
#  Item pool
# ------------------------------------------------------------
# Fields per item:
#   material, display-name, lore, base-price, chance, max-stock
#   rarity: COMMON | RARE | EPIC | LEGENDARY
#           (aliases: SIRADAN, NADIR, DESTANSI, EFSANEVI)
#   custom-model-data: optional
#   discount: { min, max }  percentage
#   reward:
#     type: ITEM or COMMAND
#     amount: item count (shown as xN on hologram)
#     command: console command (%player% supported)
# ------------------------------------------------------------
items:
  diamond-sword:
    material: DIAMOND_SWORD
    display-name: "&bDiamond Sword"
    lore:
      - "&7A sharp diamond sword."
      - "&7Damage: &c+7"
    base-price: 1200.0
    chance: 25
    max-stock: 2
    rarity: RARE
    discount: { min: 10, max: 40 }
    reward: { type: ITEM, amount: 1 }

  enchanted-golden-apple:
    material: ENCHANTED_GOLDEN_APPLE
    display-name: "&6Enchanted Golden Apple"
    lore:
      - "&7A lifesaver in tough moments."
      - "&aRegeneration V &7| &cResistance IV"
    base-price: 1500.0
    chance: 15
    max-stock: 3
    rarity: EPIC
