name: ENightMarket
version: '${project.version}'
main: com.emergent.gecepazari.GecePazariPlugin
api-version: '1.21'
authors: [ArtfulMiner]
description: Paper 1.21.4 icin gelistirilmis, Valorant tarzi cok dilli ve programlanabilir Gece Pazari eklentisi.
depend: [Vault]
softdepend: [PlaceholderAPI]
commands:
  gecepazari:
    description: Gece Pazarini acar, yonetir veya dil ayarini degistirir.
    usage: /gecepazari [baslat|durdur|reload|lang]
    aliases: [enightmarket, nightmarket, gp, nm, gece]
permissions:
  enightmarket.use:
    description: Pazari kullanma ve GUI acma izni.
    default: true
  enightmarket.lang:
    description: /gecepazari lang komutuyla dil degistirme izni.
    default: true
  enightmarket.notify:
    description: Otomatik plan tetiklendiginde bildirim alma izni.
    default: true
  enightmarket.admin:
    description: Yonetici komutlari (baslat, durdur, reload). Tum * izinleri.
    default: op
    children:
      enightmarket.use: true
      enightmarket.lang: true
      enightmarket.notify: true
  enightmarket.bypass:
    description: Etkinlik kapali olsa bile pazari acabilir.
    default: op
