name: ENightMarket
version: '${project.version}'
main: com.emergent.gecepazari.GecePazariPlugin
api-version: '1.18'
authors: [ArtfulMiner]
description: Minecraft 1.18-1.21 (Paper/Spigot/Bukkit) icin Valorant tarzi cok dilli Gece Pazari eklentisi.
depend: [Vault]
softdepend: [PlaceholderAPI]
commands:
  gecepazari:
    description: Gece Pazarini acar veya dil ayarini degistirir.
    usage: /gecepazari [lang]
    aliases: [nightmarket, gp, nm, gece]
  enightmarket:
    description: Gece Pazarini acar veya etkinligi yonetir.
    usage: /enightmarket [start|stop|reload]
    aliases: [em]
permissions:
  enightmarket.use:
    description: Pazari kullanma ve GUI acma izni.
    default: true
  enightmarket.lang:
    description: /gecepazari lang komutuyla dil degistirme izni.
    default: true
  enightmarket.notify:
    description: Otomatik plan tetiklendiginde bildirim alma izni.
    default: true
  enightmarket.admin:
    description: Yonetici komutlari (baslat, durdur, reload). Tum * izinleri.
    default: op
    children:
      enightmarket.use: true
      enightmarket.lang: true
      enightmarket.notify: true
  enightmarket.bypass:
    description: Etkinlik kapali olsa bile pazari acabilir (varsayilan kapali).
    default: false
