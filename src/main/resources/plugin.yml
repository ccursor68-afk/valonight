name: GecePazari
version: '${project.version}'
main: com.emergent.gecepazari.GecePazariPlugin
api-version: '1.21'
authors: [Emergent]
description: Oyunculara kisiye ozel, indirimli ve sinirli stoklu bir gece pazari sunan eklenti.
depend: [Vault]
commands:
  gecepazari:
    description: Gece Pazarini acar veya yoneticiler icin baslatma komutunu calistirir.
    usage: /gecepazari [baslat|reload]
    aliases: [gp, gece]
permissions:
  gecepazari.use:
    description: Gece Pazarini kullanmaya izin verir.
    default: true
  gecepazari.admin:
    description: Yonetici komutlarini kullanmaya izin verir.
    default: op
